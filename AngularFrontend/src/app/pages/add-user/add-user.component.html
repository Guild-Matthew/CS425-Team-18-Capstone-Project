  <div class="page-wrapper">
    <header>
      <div class="top-bar">
        <div class="top-links">
          <a class="nav-link" routerLink="/map">Map</a>
          <a class="nav-link" routerLink="/dashboard">Dashboard</a>
          <a class="login-button" routerLink="/login">Logout</a>
        </div>
      </div>
      <div class="branding-bar">
        <img
          src="https://www.unr.edu/Assets/Icons/logos/university-logo.svg"
          alt="University of Nevada, Reno"
          width="65"
          height="65"
        />
        <h1>University of Nevada, Reno</h1>
        <p>Inspiring Excellence Since 1874</p>
      </div>
    </header>
  
    <main class="main-content">
      <section class="form-card">
        <h2>Add New User</h2>
        <form (ngSubmit)="addUser()" #addUserForm="ngForm">
          <label for="name">Name:</label>
          <input
            id="name"
            name="name"
            [(ngModel)]="user.name"
            required
            placeholder="Enter user's name"
          />
  
          <label for="email">Email:</label>
          <input
            id="email"
            name="email"
            [(ngModel)]="user.email"
            type="email"
            required
            placeholder="Enter user's email"
          />
  
          <label for="role">Role:</label>
          <select id="role" name="role" [(ngModel)]="user.role" required>
            <option value="" disabled>Select a role</option>
            <option value="admin">Admin</option>
            <option value="user">User</option>
          </select>
  
          <div class="add-item-button-wrapper">
            <button type="submit" class="add-item-button">Add User</button>
          </div>
        </form>
      </section>
    </main>
  
    <footer>
      <p>&copy; 2025 University of Nevada, Reno. User Management System.</p>
    </footer>
  </div>
