<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UNR Lost and Found</title>
</head>

<body>
  <!--Header section-->
  <header>
    <div class="container">
      <div class="logo-group">
        <img class="university-logo-large-img align-image-bottom" alt="University of Nevada, Reno " src="https://www.unr.edu/Assets/Icons/logos/university-logo.svg" width="65" height="65">
        <span class="logo-text-new align-text-middle">
          University of Nevada, Reno
        </span>
      </div>
      <h1>Manage Access</h1>
      <nav>
        <ul>
          <!--Shane Petree 1 line-->
          <li><a routerLink="/super-admin-home">Dashboard</a></li>
          <li><a routerLink="/map">Map</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <section class="add-building-form">
    <h2>Add a Building</h2>
    <form (ngSubmit)="onSubmit()" enctype="multipart/form-data">
      <!-- Building Information -->
      <label for="BuildingCode">Enter the building code in the building code format (SEM,AB,DMSC etc)</label>
      <input type="text" id="BuildingCode" name="BuildingCode" [(ngModel)]="building.BuildingCode" required>

      <label for="coordinates">Enter Coordinates (Lat, Lng):</label>
      <input type="text" id="coordinates" name="coordinates" [(ngModel)]="building.coordinates" required>

      <!-- Submit Button -->
      <button type="submit">Add building</button>
    </form>
  </section>

  <!--Footer section-->
  <footer>
    <p>&copy; 2024 University of Nevada, Reno. Lost and Found Service.</p>
  </footer>

  <!--<script src="addUser.js"></script>-->
</body>

</html>
