<div class="remove-items">
  <header>
    <div class="container">
      <h1>Remove Items</h1>
      <nav>
        <ul>
          <li><a routerLink="/dashboard">Dashboard</a></li>
          <li><a routerLink="/map">Map</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <div class="main-content">
    <aside class="sidebar">
      <h2>Sort & Filter</h2>
      <div class="filter-section">
        <label for="sort">Sort By:</label>
        <select id="sort" (change)="onSortChange($event)">
          <option value="newest">Date Found: Most Recent</option>
          <option value="oldest">Date Found: Oldest</option>
        </select>
      </div>

      <div class="filter-section">
        <label for="filterType">Filter by Type:</label>
        <select id="filterType" (change)="onFilterChange($event)">
          <option value="all">All</option>
          <option value="clothing">Clothing</option>
          <option value="technology">Electronics</option>
          <option value="misc">Miscellaneous</option>
        </select>
      </div>

      <div class="filter-section">
        <label for="building">Lost and Found Location:</label>
        <select id="building" [(ngModel)]="building" (change)="fetchItems()">
          <option *ngFor="let b of buildings" [value]="b">{{ b }}</option>
        </select>
      </div>
    </aside>

    <section id="products">
      <h2>Found Items in Building: {{ building }}</h2>
      <div class="product-grid">
        <div *ngFor="let item of items" class="product">
          <h3><strong>Item type:</strong> {{ item.type }}</h3>
          <h3><strong>Location found:</strong> {{ item.location }}</h3>
          <h3><strong>Date found:</strong> {{ item.dateFound }}</h3>
          <h3><strong>Description:</strong> {{ item.description }}</h3>
          <button (click)="removeItem(item)" class="delete-btn">Delete</button>
        </div>
      </div>
    </section>
  </div>

  <footer>
    <p>&copy; 2025 University of Nevada, Reno. Lost and Found Service.</p>
  </footer>
</div>
