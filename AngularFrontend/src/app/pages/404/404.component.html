<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Page Not Found</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background-color: #f4f4f4;
      margin: 0;
      text-align: center;
    }

    .container {
      max-width: 500px;
      padding: 20px;
    }

    h1 {
      font-size: 80px;
      color: #ff4757;
      margin: 0;
    }

    p {
      font-size: 20px;
      color: #555;
    }

    .btn {
      display: inline-block;
      padding: 10px 20px;
      margin-top: 20px;
      font-size: 18px;
      color: white;
      background-color: #ff4757;
      text-decoration: none;
      border-radius: 5px;
      transition: 0.3s;
    }

      .btn:hover {
        background-color: #e84118;
      }
  </style>
</head>
<body>
  <div class="container">
    <h1>404</h1>
    <p>Oops! The page you're looking for doesn't exist.</p>
    <!--<a href="/" class="btn">Go Back Home</a>-->
    <a routerLink="/map" class="btn">Go Back Home</a>
  </div>
</body>
</html>
