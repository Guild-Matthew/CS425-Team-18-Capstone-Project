<div class="page-wrapper">
  <!-- HEADER -->
  <header class="header">
    <div class="top-bar">
      <div class="top-links">
        <a class="nav-link" routerLink="/map">Map</a>
        <a class="nav-link" routerLink="/dashboard">Dashboard</a>
        <a class="nav-link" routerLink="/lost-and-found">Lost & Found</a>
        <a class="login-button" routerLink="/login">Logout</a>            
      </div>
    </div>
  
    <div class="branding-bar">
      <img class="university-logo-large-img align-image-bottom" alt="University of Nevada, Reno"
      src="https://www.unr.edu/Assets/Icons/logos/university-logo.svg" width="65" height="65">
       <h1>University of Nevada, Reno</h1>
      <p>Inspiring Excellence Since 1874</p>
    </div>
  </header>

  <!-- MAIN CONTENT -->
  <main class="content-area">
    <div class="content-wrapper">
      <!-- Sidebar -->
      <div class="sidebar">
        <h2>Sort & Filter</h2>
        <div class="filter-section">
          <label for="building">Filter by Building:</label>
          <select id="building">
            <option value="all">All</option>
          </select>
        </div>
      </div>

      <!-- Users Section -->
      <div class="user-section">
        <div class="user-header">
          <h2 class="students-header">Students Working in Selected Building</h2>
          <button class="main-content-button" [routerLink]="'/add-user'">Add User</button>
        </div>

        <!-- Cards -->
        <div class="user-card-grid">
          <div class="user-card" *ngFor="let user of filteredUsers">
            <p><strong>Name:</strong> {{ user.name }}</p>
            <p><strong>Email:</strong> {{ user.email }}</p>
            <p><strong>Building:</strong> {{ user.building }}</p>
            <button (click)="deactivateUser(user.id)">Deactivate</button>
          </div>
        </div>
      </div>
    </div>
  </main>

  <!-- FOOTER -->
  <footer class="footer">
    <p>&copy; 2025 University of Nevada, Reno. Lost and Found Service.</p>
  </footer>
</div>
