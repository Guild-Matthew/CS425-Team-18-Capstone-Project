<span *ngIf="role !== 'admin'">
  <a routerLink="/login">Login</a>
</span>
<!--Mary Cottier, Guilherme Cassiano-->
<div class="main-container" *ngIf="role === 'admin'">
  <header>
    <div class="logo-group">
      <img class="university-logo-large-img align-image-bottom" alt="University of Nevada, Reno" src="https://www.unr.edu/Assets/Icons/logos/university-logo.svg" width="65" height="65">
      <span class="logo-text-new align-text-middle">University of Nevada, Reno - Lost and Found Admin</span>
    </div>
    <nav>
      <ul>
        <li><a routerLink="/map">Map</a></li>
        <li><a routerLink="/login">Logout</a></li>
      </ul>
    </nav>
  </header>

  <!-- Hero Section -->
  <section class="hero">
    <div class="hero-overlay"></div>
    <div class="hero-content">
      <h1>Admin Dashboard</h1>
      <p>Manage lost and found items, edit access, and edit your buildings.</p>
      <div class="hero-buttons">
        <a routerLink="/lost-and-found" class="hero-button">View All Items</a>
        <a routerLink="/generate-report" class="hero-button">Generate Report</a>
        <a routerLink="/add-user" class="hero-button">Edit Access</a>
        <a routerLink="/add-building" class="hero-button">Edit Buildings</a>
      </div>
    </div>
  </section>

  <!-- Footer Section -->
  <footer>
    <p>&copy; 2024 University of Nevada, Reno. Admin Dashboard.</p>
  </footer>
</div>
