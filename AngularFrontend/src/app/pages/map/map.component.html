<nav>
  <a routerLink="/">Home</a> |
  <a routerLink="/map">Map</a> |
  <a routerLink="/dashboard">Dashboard</a>
</nav>

<google-map *ngIf="center" [center]="center" [zoom]="zoom" [options]="mapOptions">
  <map-marker *ngFor="let marker of markers"
              [position]="marker"
              [title]="marker.title"
              (mapClick)="onMarkerClick(marker.title)">
  </map-marker>
</google-map>
