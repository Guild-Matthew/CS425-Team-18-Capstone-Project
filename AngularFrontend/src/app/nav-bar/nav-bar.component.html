<header class="header">
  <div class="top-bar">
    <div class="top-links">

      <a class="nav-link" routerLink="/map">MAP</a>

      <div *ngIf="isLoggedIn">
        <a class="nav-link" routerLink="/dashboard">DASHBOARD</a>
        <a class="nav-link" routerLink="/lost-and-found">LOST & FOUND</a>
        <a class="login-button" routerLink="/logout">LOGOUT</a>
      </div>

      <div *ngIf="!isLoggedIn">
        <a class="login-button" routerLink="/login">LOGIN</a>
      </div>

    </div>
  </div>

  <div class="branding-bar">
    <img src="https://www.unr.edu/Assets/Icons/logos/university-logo.svg" alt="University Logo" />
    <h1>University of Nevada, Reno</h1>
    <p>Inspiring Excellence Since 1874</p>
  </div>
</header>
